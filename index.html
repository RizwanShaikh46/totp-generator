<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOTP Generator</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at top, #273b67, #111827 55%); color: #edf2ff; }
      main { width: min(92vw, 510px); padding: 2.5rem; border: 1px solid #536a99; border-radius: 24px; background: rgba(18, 29, 53, .88); box-shadow: 0 24px 80px #0007; }
      h1 { margin: 0; font-size: 1.75rem; }
      p { color: #b9c7e5; line-height: 1.5; }
      label { display: block; margin: 1.5rem 0 .5rem; font-weight: 650; }
      input { width: 100%; padding: .9rem 1rem; border: 1px solid #6076a4; border-radius: 10px; background: #0d1730; color: inherit; font: inherit; letter-spacing: .04em; }
      input:focus { outline: 3px solid #6d9bff88; border-color: #86adff; }
      .otp { margin: 1.5rem 0 .5rem; text-align: center; font: 700 clamp(2.7rem, 12vw, 4.6rem)/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; color: #fff; }
      .meta { display: flex; justify-content: space-between; align-items: center; color: #b9c7e5; }
      .bar { height: 7px; margin-top: .75rem; overflow: hidden; border-radius: 999px; background: #31466d; }
      .bar > div { height: 100%; background: #72e2ad; transition: width .25s linear; }
      .error { min-height: 1.5rem; margin-top: 1rem; color: #ffadad; }
      .hint { margin-bottom: 0; font-size: .85rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>TOTP Generator</h1>
      <p>Enter your Base32 secret key to generate a six-digit, 15-second time-based one-time password.</p>
      <label for="secret">Secret key</label>
      <input id="secret" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. JBSWY3DPEHPK3PXP" />
      <div class="otp" id="otp">------</div>
      <div class="meta"><span id="status">Waiting for a secret</span><span id="remaining">30s</span></div>
      <div class="bar"><div id="progress"></div></div>
      <div class="error" id="error" role="alert"></div>
      <p class="hint">The secret stays in this browser and is never sent anywhere.</p>
    </main>
    <script>
      const secretInput = document.querySelector('#secret');
      const otpEl = document.querySelector('#otp');
      const statusEl = document.querySelector('#status');
      const remainingEl = document.querySelector('#remaining');
      const progressEl = document.querySelector('#progress');
      const errorEl = document.querySelector('#error');
      let lastCounter = -1;

      function base32ToBytes(value) {
        const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
        const normalized = value.toUpperCase().replace(/[\s-]/g, '').replace(/=+$/, '');
        if (!normalized) throw new Error('Enter a secret key to begin.');
        if (!/^[A-Z2-7]+$/.test(normalized)) throw new Error('Use a valid Base32 secret key.');
        let bits = '';
        for (const char of normalized) bits += alphabet.indexOf(char).toString(2).padStart(5, '0');
        const bytes = [];
        for (let i = 0; i + 8 <= bits.length; i += 8) bytes.push(parseInt(bits.slice(i, i + 8), 2));
        return new Uint8Array(bytes);
      }

      async function generateTOTP(secret, counter) {
        const key = await crypto.subtle.importKey('raw', base32ToBytes(secret), { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
        const buffer = new ArrayBuffer(8);
        const view = new DataView(buffer);
        view.setUint32(4, counter, false);
        const hash = new Uint8Array(await crypto.subtle.sign('HMAC', key, buffer));
        const offset = hash[19] & 15;
        const code = ((hash[offset] & 127) << 24) | (hash[offset + 1] << 16) | (hash[offset + 2] << 8) | hash[offset + 3];
        return String(code % 1_000_000).padStart(6, '0');
      }

      async function refresh() {
        const now = Date.now();
        const remaining = 30 - Math.floor((now / 1000) % 15);
        remainingEl.textContent = `${remaining}s`;
        progressEl.style.width = `${(remaining / 15) * 100}%`;
        const counter = Math.floor(now / 15_000);
        const secret = secretInput.value;
        if (!secret.trim()) { otpEl.textContent = '------'; statusEl.textContent = 'Waiting for a secret'; errorEl.textContent = ''; lastCounter = -1; return; }
        if (counter === lastCounter) return;
        try {
          otpEl.textContent = await generateTOTP(secret, counter);
          statusEl.textContent = 'Current code'; errorEl.textContent = ''; lastCounter = counter;
        } catch (error) {
          otpEl.textContent = '------'; statusEl.textContent = 'Invalid secret'; errorEl.textContent = error.message; lastCounter = counter;
        }
      }
      secretInput.addEventListener('input', () => { lastCounter = -1; refresh(); });
      setInterval(refresh, 250);
      refresh();
    </script>
  </body>
</html>
